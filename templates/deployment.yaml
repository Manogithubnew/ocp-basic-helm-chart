{{- range .Values.app.variants }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yourchart.fullname" $ }}-{{ .version }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "yourchart.name" $ }}
      version: {{ .version }}
  template:
    metadata:
      labels:
        app: {{ include "yourchart.name" $ }}
        version: {{ .version }}
    spec:
      containers:
        - name: {{ include "yourchart.name" $ }}
          image: "{{ $.Values.image.repository }}:{{ .version }}"
          ports:
            - containerPort: {{ $.Values.service.port }}
{{- end }}

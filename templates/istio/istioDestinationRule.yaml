{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ .Values.istio.app.name }}-dr
  namespace: {{ .Values.istio.app.namespace }}
spec:
  host: {{ .Values.istio.app.name }}
  subsets:
    {{- range .Values.istio.subsets }}
    - name: {{ .name }}
      labels:
        {{- toYaml .labels | nindent 8 }}
    {{- end }}
{{- end }}

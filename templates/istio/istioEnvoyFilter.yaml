{{- if .Values.envoyFilter.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: {{ .Values.envoyFilter.name }}
  namespace: {{ .Values.envoyFilter.namespace }}
spec:
  workloadSelector:
    labels:
      {{- toYaml .Values.envoyFilter.workloadSelector.labels | nindent 6 }}
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: {{ .Values.envoyFilter.patchContext }}
        listener:
          portNumber: {{ .Values.envoyFilter.port }}
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inlineCode: |
              function envoy_on_request(handle)
                local headers = handle:headers()
                local remote_addr = headers:get("x-forwarded-for") or ""
                local region = nil

                -- region matching
                {{- range $region, $data := .Values.envoyFilter.regionMappings }}
                if string.match(remote_addr, "{{ $data.cidr }}") then
                  region = "{{ $region }}"
                end
                {{ end }}

                -- fallback if no region matched
                if region == nil then
                  region = "{{ .Values.envoyFilter.fallback }}"
                end

                headers:add("x-region", region)
              end
{{- end }}
